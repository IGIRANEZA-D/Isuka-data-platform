<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isuka | Admin Login</title><link rel="stylesheet" href="/admin.css">
  <script>
(() => {
  const transitionKey = 'isuka-page-loader-transition';
  let transition = null;
  let showLoader = false;
  try {
    transition = JSON.parse(sessionStorage.getItem(transitionKey) || 'null');
    sessionStorage.removeItem(transitionKey);
    if (!transition || transition.to !== window.location.pathname) transition = null;
    const navigation = performance.getEntriesByType('navigation')[0];
    const hasVisited = sessionStorage.getItem('isuka-page-seen') === '1';
    showLoader = Boolean(transition) || navigation?.type === 'reload' || !hasVisited;
    sessionStorage.setItem('isuka-page-seen', '1');
  } catch {
    showLoader = true;
  }
  window.__isukaLoaderEntry = { show: showLoader, startedAt: transition?.startedAt || Date.now() };
  if (showLoader) document.documentElement.classList.add('isuka-loader-enabled');
})();
</script>
  <link rel="stylesheet" href="/page-loader.css">
  <script src="/page-loader.js" defer></script>
</head>
<body class="admin-login-page">
  <div class="isuka-page-loader" data-isuka-page-loader role="status" aria-live="polite" aria-label="Loading Isuka">
    <img class="isuka-page-loader__logo" src="/assets/isuka-logo.png" alt="Isuka">
    <div class="isuka-page-loader__track" aria-hidden="true"><span class="isuka-page-loader__progress" data-loader-progress></span></div>
    <div class="isuka-page-loader__status"><span>Loading Isuka</span><strong data-loader-percent>0%</strong></div>
  </div>
  <main class="admin-login-card" aria-live="polite">
    <img src="/assets/isuka-logo.png" alt="Isuka">
    <span class="admin-kicker">Platform administration</span>
    <h1>Admin access</h1>
    <p>Manage published agricultural datasets and keep the public dashboard up to date.</p>
    <div class="admin-login-banner" data-admin-login-banner hidden>
      <span class="admin-login-banner-icon" aria-hidden="true">!</span>
      <span data-admin-login-banner-text></span>
    </div>
    <form class="admin-login-form" data-admin-login novalidate>
      <label>Email
        <input name="email" type="email" autocomplete="username" placeholder="admin@isuka.rw" required aria-describedby="admin-login-error">
      </label>
      <label>Password
        <div class="admin-password">
          <input name="password" type="password" autocomplete="current-password" placeholder="Enter password" required aria-describedby="admin-login-error">
          <button class="admin-password-toggle" type="button" data-admin-password-toggle aria-label="Show password">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
          </button>
        </div>
      </label>
      <small class="admin-login-note" data-admin-login-note id="admin-login-error" aria-live="polite"></small>
      <button class="admin-action" type="submit" data-admin-login-submit>Enter admin workspace</button>
    </form>
    <a class="admin-login-home" href="/">Back to home</a>
  </main>
  <script src="/admin.js"></script>
</body>
</html>
